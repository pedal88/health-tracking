name: Garmin Health Sync

on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC (06:00 CET / 07:00 CEST)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: pip install -r requirements.txt

      - name: Sync Withings to Garmin
        run: |
          # Create config files from secrets
          echo '${{ secrets.WITHINGS_APP_JSON }}' > withings_app.json
          echo '${{ secrets.WITHINGS_USER_JSON }}' > .withings_user.json
          
          # Run sync with explicit config paths
          export WITHINGS_APP=$(pwd)/withings_app.json
          export WITHINGS_USER=$(pwd)/.withings_user.json
          
          withings-sync --garmin-username ${{ secrets.GARMIN_EMAIL }} \
                        --garmin-password ${{ secrets.GARMIN_PASSWORD }}
        continue-on-error: true # Don't fail the whole pipeline if just the scale sync fails

      - name: Sync with 1-hour retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 3600 # 1 hour
          command: python src/main.py
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
